name: Pre-commit autoupdate

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  autoupdate:
    name: Run pre-commit autoupdate and open a PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv 🌟
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 #v8.2.0

      - name: Run pre-commit autoupdate 🔄
        run: uvx pre-commit autoupdate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request 📬
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="pre-commit-autoupdate"
          git switch -c "$branch"
          git add .pre-commit-config.yaml
          git commit -m "chore: pre-commit autoupdate"
          git push --force origin "$branch"

          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --title "chore: pre-commit autoupdate" \
              --body "Automated update of pre-commit hook versions via \`pre-commit autoupdate\`." \
              --head "$branch" \
              --base main
          fi
